# XcodeGen spec: the Mac workflow turns it into Time2Play.xcodeproj (the project file isn't kept in git).
name: Time2Play
options:
  bundleIdPrefix: live.time2play
  deploymentTarget:
    iOS: "17.0"
packages:
  T2PCore:
    path: Core
targets:
  Time2Play:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: T2PCore
    info:
      path: App/Info.plist
      properties:
        # time2play://join/K7QP: the app's own links (a notification, a test); invite links are time2play.live/K7QP
        CFBundleURLTypes:
          - CFBundleURLName: live.time2play.app
            CFBundleURLSchemes: [time2play]
    # Used once builds are signed with Tyler's Apple account (#406): invite links that open the app, invite alerts,
    # Sign in with Apple. Unsigned simulator builds leave them out.
    entitlements:
      path: App/Time2Play.entitlements
      properties:
        com.apple.developer.associated-domains: ["applinks:time2play.live"]
        aps-environment: development
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.time2play.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Time2Play uses the camera to scan a room’s QR code, so you can join without typing the code."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Time2Play
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  Time2PlayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Time2Play
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.time2play.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: Time2Play
schemes:
  Time2Play:
    build:
      targets:
        Time2Play: all
        Time2PlayUITests: [test]
    test:
      targets: [Time2PlayUITests]
