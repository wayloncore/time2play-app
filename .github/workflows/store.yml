# The App Store listing (#407): takes the screenshots on a 6.9" iPhone and a 13" iPad simulator (UITests/StoreUITests),
# then fills in App Store Connect from store/metadata.json: the words, the category, App Review's notes and contact,
# the screenshots (only into empty sets) and the newest processed build. It NEVER submits for review; that's Tyler's
# call. Start it by hand (Actions -> Store listing -> Run workflow, or the REST dispatch), or with a tag in a pushed
# commit's message (main or a claude/ branch): [store-shots] takes the screenshots only, [store-fill] also fills in
# App Store Connect. Small previews of the screenshots are printed into the log.
name: Store listing
on:
  workflow_dispatch:
    inputs:
      fill:
        description: "Fill in App Store Connect (false: screenshots only)"
        required: false
        default: "true"
      shots:
        description: "take: new screenshots on the Mac. committed: Tyler's approved captioned ones in store/shots (Linux, no Mac)"
        required: false
        default: "take"
  push:
    branches: [main, "claude/**"]
permissions:
  contents: read
concurrency:
  group: store
  cancel-in-progress: false
jobs:
  listing:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.shots != 'committed') || contains(github.event.head_commit.message, '[store-')
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Xcode and the project
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_ENV"
          X=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          brew install xcodegen >/dev/null && xcodegen generate
      - name: Pick the store's simulators (6.9" iPhone, 13" iPad)
        run: |
          xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          best={}
          for rt,devs in d.items():
              m=re.search(r"iOS-(\d+)-(\d+)",rt)
              if not m: continue
              v=(int(m.group(1)),int(m.group(2)))
              for x in devs:
                  n=x["name"]
                  kind="PHONE" if re.fullmatch(r"iPhone \d+ Pro Max",n) else "PAD" if n.startswith("iPad Pro 13") else None
                  if kind and (kind not in best or (v,n)>best[kind][0]): best[kind]=((v,n),x["udid"])
          for k,(vn,u) in best.items(): print(f"{k}={u}"); print(k,vn,file=sys.stderr)' >> "$GITHUB_ENV"
      - name: Screenshots
        run: |
          t=$(date +%s); set -o pipefail
          mkdir -p "$HOME/t2p-shots"
          for U in "$PHONE" "$PAD"; do
            [ -n "$U" ] || continue
            xcrun simctl boot "$U"; xcrun simctl bootstatus "$U" -b
            xcrun simctl ui "$U" appearance dark
            xcrun simctl status_bar "$U" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || \
              xcrun simctl status_bar "$U" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3
            xcodebuild -project Time2Play.xcodeproj -scheme Time2Play -configuration Debug \
              -destination "id=$U" -derivedDataPath build -parallel-testing-enabled NO \
              -only-testing:Time2PlayUITests/StoreUITests CODE_SIGNING_ALLOWED=NO test 2>&1 \
              | grep -E "Test (Case|Suite)|error:|failed|XCTAssert|\*\* TEST|Executed" | tail -20
            xcrun simctl shutdown "$U" || true
          done
          for f in "$HOME"/t2p-shots/store-*.png; do echo "$(basename "$f"): $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf "%s ", $2}') hasAlpha=$(sips -g hasAlpha "$f" | awk '/hasAlpha/{print $2}')"; done
          echo "shots_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Full-size screenshots into the log (for the captioned set in store/shots)
        if: always()
        run: |
          # artifact downloads don't reach a cloud session, the log does: full size, as JPEG (App Store Connect takes it)
          mkdir -p "$RUNNER_TEMP/full"
          for f in "$HOME"/t2p-shots/store-*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .png); sips -s format jpeg -s formatOptions 92 "$f" --out "$RUNNER_TEMP/full/$n.jpg" >/dev/null
            echo "BEGIN-FULL $n.jpg"; base64 -i "$RUNNER_TEMP/full/$n.jpg" | fold -w 4000; echo "END-FULL"
          done
      - name: Small previews into the log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/small"
          for f in "$HOME"/t2p-shots/store-*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .png); sips -Z 900 -s format jpeg -s formatOptions 70 "$f" --out "$RUNNER_TEMP/small/$n.jpg" >/dev/null
            echo "BEGIN-SHOT $n.jpg"; base64 -i "$RUNNER_TEMP/small/$n.jpg" | fold -w 4000; echo "END-SHOT"
          done
      - name: Fill in App Store Connect (never submits)
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.fill != 'false') || contains(github.event.head_commit.message, '[store-fill]')
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          REVIEW_SIGNIN_KEY: ${{ secrets.REVIEW_SIGNIN_KEY }}
        run: |
          umask 077; mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8"
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" -q install cryptography==44.0.2 pyjwt==2.10.1
          "$RUNNER_TEMP/venv/bin/python" -I scripts/asc.py store store/metadata.json "$HOME/t2p-shots" || rc=$?
          rm -rf "$RUNNER_TEMP/asc"
          exit ${rc:-0}
      - name: Timing
        if: always()
        run: echo "TIMING shots=${shots_s:-?} total=$(( $(date +%s) - start ))"
  # The approved captioned screenshots (store/shots, made from a run's store-shots download) go in with the words.
  # Linux, no Mac. Same fill as above: it never submits.
  committed:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.shots == 'committed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fill in App Store Connect with store/shots (never submits)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          REVIEW_SIGNIN_KEY: ${{ secrets.REVIEW_SIGNIN_KEY }}
        run: |
          ls -la store/shots
          umask 077; mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8"
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" -q install cryptography==44.0.2 pyjwt==2.10.1
          "$RUNNER_TEMP/venv/bin/python" -I scripts/asc.py store store/metadata.json store/shots || rc=$?
          rm -rf "$RUNNER_TEMP/asc"
          exit ${rc:-0}
