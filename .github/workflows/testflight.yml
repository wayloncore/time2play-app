# The signed build, uploaded to App Store Connect for TestFlight (#406). Start it by hand (Actions -> TestFlight ->
# Run workflow, or the REST dispatch) or with [testflight] in a pushed commit's message (main or a claude/ branch). It never submits
# anything for App Review; that's Tyler's call, in App Store Connect.
#
# Keys: the App Store Connect API key is written to a temp file only for this job and deleted at the end. The
# distribution certificate's key is re-made from it each run (scripts/asc.py), so no signing key is stored anywhere.
name: TestFlight
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
env:
  TEAM_ID: 6WK983RXJT
  BUNDLE_ID: live.time2play.app
jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      build: ${{ steps.number.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: number
        name: Version and build number
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_ENV"
          # The build number rises every run (Apple needs a new one per upload); the version is project.yml's 1.0
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          X=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: The App Store Connect key, into a temp file (never printed)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc/key.p8" || { echo "::error::ASC_KEY_P8 isn't the .p8 text"; exit 1; }
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/key.p8" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install pycryptodome==3.21.0 cryptography==44.0.2 pyjwt==2.10.1
      - name: Does time2play.live name this app? (invite links, #404)
        run: |
          curl -fsS https://time2play.live/.well-known/apple-app-site-association -o aasa.json -w "HTTP %{http_code}, %{content_type}\n" || true
          cat aasa.json 2>/dev/null; echo
          if grep -q "$TEAM_ID.$BUNDLE_ID" aasa.json 2>/dev/null; then echo "AASA: names $TEAM_ID.$BUNDLE_ID"; else echo "::warning::time2play.live's apple-app-site-association doesn't name $TEAM_ID.$BUNDLE_ID"; fi
      - name: Distribution certificate and the App Store profiles (the app's and its widget's)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I scripts/asc.py signing "$RUNNER_TEMP/sign"
          # a temp keychain with the certificate and its key
          KC="$RUNNER_TEMP/sign/build.keychain-db"; KCP=$(uuidgen)
          echo "::add-mask::$KCP"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/sign/wwdr.cer"
          security import "$RUNNER_TEMP/sign/wwdr.cer" -k "$KC" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/sign/dist.p12" -k "$KC" -f pkcs12 -P "$(cat "$RUNNER_TEMP/sign/dist.p12.pass")" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$RUNNER_TEMP/sign/dist.p12" "$RUNNER_TEMP/sign/dist.p12.pass"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | sed 's/[0-9A-F]\{40\}/<hash>/'
          # each profile where Xcode looks for it
          # (named by its UUID; the GITHUB_ENV values only reach later steps, so read it from the profile here)
          for p in "$RUNNER_TEMP"/sign/*.mobileprovision; do
            UUID=$(security cms -D -i "$p" | plutil -extract UUID raw -o - -)
            echo "Profile $(basename "$p"): $UUID"
            for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$d"; cp "$p" "$d/$UUID.mobileprovision"
            done
          done
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Generate the Xcode project (App Store entitlements)
        run: |
          brew install xcodegen >/dev/null && xcodegen generate
          # App Store builds use Apple's production push service
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" App/Time2Play.entitlements
          # Game Center (#541): only once the App ID has it, so its profile carries the entitlement (else signing fails)
          if security cms -D -i "$RUNNER_TEMP/sign/app.mobileprovision" | grep -q "com.apple.developer.game-center"; then
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.game-center bool true" App/Time2Play.entitlements && echo "Game Center: in the entitlements"
          else echo "Game Center: not on the App ID yet (scripts/asc.py gamecenter), left out"; fi
          plutil -p App/Time2Play.entitlements
      - name: Archive (signed)
        run: |
          t=$(date +%s); set -o pipefail
          xcodebuild -project Time2Play.xcodeproj -scheme Time2Play -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Time2Play.xcarchive" \
            T2P_PROFILE="$T2P_PROFILE_NAME" T2P_WIDGET_PROFILE="$T2P_WIDGET_PROFILE_NAME" CURRENT_PROJECT_VERSION="$BUILD" OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive 2>&1 | grep -E "error:|warning: .*(sign|profile|entitle)|\*\* ARCHIVE|Signing Identity|Provisioning Profile" | tail -40
          echo "archive_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
          APP="$RUNNER_TEMP/Time2Play.xcarchive/Products/Applications/Time2Play.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :CFBundleDisplayName" -c "Print :ITSAppUsesNonExemptEncryption" "$APP/Info.plist"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleVersion" "$APP/PlugIns/Time2PlayWidget.appex/Info.plist"
          codesign -d --entitlements - --xml "$APP/PlugIns/Time2PlayWidget.appex" 2>/dev/null | plutil -p - || true
      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          t=$(date +%s); set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$T2P_PROFILE_NAME</string>
              <key>$BUNDLE_ID.widget</key><string>$T2P_WIDGET_PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Time2Play.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | grep -v -E "^\s*$" | tail -40
          echo "upload_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
          echo "Uploaded build $BUILD (version 1.0)" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up the keys
        if: always()
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/sign"
          total=$(( $(date +%s) - start ))
          echo "TIMING archive=${archive_s:-?} upload=${upload_s:-?} total=$total"

  # Waiting for Apple's processing doesn't need a Mac
  processing:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Wait for TestFlight processing, then internal testing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          umask 077; mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8"
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" -q install cryptography==44.0.2 pyjwt==2.10.1
          "$RUNNER_TEMP/venv/bin/python" -I scripts/asc.py wait "${{ needs.upload.outputs.build }}" || rc=$?
          "$RUNNER_TEMP/venv/bin/python" -I scripts/asc.py status || true
          rm -rf "$RUNNER_TEMP/asc"
          exit ${rc:-0}
