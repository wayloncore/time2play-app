# The sound effects' source (Tyler, Nov 17): Kenney's recorded CC0 packs (kenney.nl). A cloud session can't reach
# kenney.nl, so this Linux job downloads the packs, checks each is CC0, lists what's in it, and prints the sounds
# asked for into the log as base64 (the way the Mac run prints screenshots). The picked sounds are then trimmed,
# leveled and committed by hand (scripts/sounds.py --from <dir>). Runs on a push whose message holds [sounds], or by
# hand. Linux minutes only.
name: Sounds
on:
  workflow_dispatch:
    inputs:
      pick:
        description: "Files to print as base64 (pack/name.ogg, space-separated; 'all-casino' prints the whole Casino pack)"
        required: false
        default: "all-casino"
  push:
    branches: ["**"]
permissions:
  contents: read
jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sounds]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Download the packs
        run: |
          mkdir -p packs
          for slug in casino-audio interface-sounds ui-audio; do
            page=$(curl -fsSL "https://kenney.nl/assets/$slug") || { echo "::warning::no page for $slug"; continue; }
            zip=$(printf '%s' "$page" | grep -oE 'https://kenney\.nl/media/pages/assets/[^"]+\.zip' | head -1)
            [ -z "$zip" ] && zip=$(printf '%s' "$page" | grep -oE '/media/pages/assets/[^"]+\.zip' | head -1 | sed 's#^#https://kenney.nl#')
            echo "$slug: $zip"
            [ -n "$zip" ] || { echo "::warning::no zip link for $slug"; continue; }
            curl -fsSL "$zip" -o "packs/$slug.zip" && mkdir -p "packs/$slug" && unzip -q -o "packs/$slug.zip" -d "packs/$slug"
            # the license that ships in the zip
            lic=$(find "packs/$slug" -iname 'License*.txt' | head -1)
            echo "== $slug license file: $lic"; [ -n "$lic" ] && cat "$lic"
            if [ -n "$lic" ] && grep -qiE 'CC0|creative commons zero|public domain' "$lic"; then echo "LICENSE-OK $slug CC0"; else echo "::warning::$slug: no CC0 license found"; fi
          done
      - name: What's in them
        run: |
          sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1 || true
          find packs -type f \( -iname '*.ogg' -o -iname '*.wav' -o -iname '*.mp3' \) | sort | while read f; do
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" 2>/dev/null)
            echo "FILE ${f#packs/} $(stat -c %s "$f") ${d:-?}s"
          done
      - name: The picked sounds, as base64
        env:
          PICK: ${{ github.event.inputs.pick || 'all-casino' }}
        run: |
          if [ "$PICK" = "all-casino" ]; then files=$(find packs/casino-audio -type f -iname '*.ogg' | sort); else files=""; for p in $PICK; do files="$files $(find packs -path "*$p" | head -1)"; done; fi
          for f in $files; do
            [ -f "$f" ] || continue
            echo "BEGIN-SOUND ${f#packs/}"; base64 -w 4000 "$f"; echo "END-SOUND"
          done
