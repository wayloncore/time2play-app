# The app's recorded sound effects, from free packs on OpenGameArt (scripts/sound-packs.txt). A cloud session can't
# reach OpenGameArt, but a runner can (kenney.nl refuses automated downloads, so it isn't used).
#   survey: downloads the packs, prints each page's license and author, and lists every sound's length and levels
#   pick:   trims, levels and fades the files scripts/sound-picks.json names into App/Sounds/<effect>.caf, and
#           commits only those to the branch it ran on (the packs themselves are never kept)
# Start it with the dispatch (mode survey or pick), or with [sounds-survey] or [sounds-pick] in a pushed commit's
# message (a workflow only on a branch can't be dispatched). Linux only: no Mac minutes.
name: Sounds
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "survey or pick"
        required: true
        default: "survey"
  push:
permissions:
  contents: write
jobs:
  sounds:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sounds-survey]') || contains(github.event.head_commit.message, '[sounds-pick]')
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || (contains(github.event.head_commit.message, '[sounds-pick]') && 'pick' || 'survey') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          which ffmpeg >/dev/null || { sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null; }
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" -q install numpy==2.2.4
          ffmpeg -version | head -1
      - name: Download the packs (and their licenses)
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I scripts/recorded-sounds.py packs scripts/sound-packs.txt "$RUNNER_TEMP/packs"
      - name: Survey
        if: env.MODE == 'survey'
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I scripts/recorded-sounds.py survey "$RUNNER_TEMP/packs"
      - name: Pick, level and commit the chosen files
        if: env.MODE == 'pick'
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I scripts/recorded-sounds.py pick "$RUNNER_TEMP/packs" scripts/sound-picks.json App/Sounds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'App/Sounds/*.caf' 'App/Sounds/*.wav'   # git's own globs, so a removed .wav counts too
          git status --short
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -q -m "Sounds: the recorded effects, picked from free CC0 packs (scripts/sound-picks.json)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
