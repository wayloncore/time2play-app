# Sends the App Store version to App Review (#407). Only by hand, only when Tyler says "submit": it needs the build
# number he approved, and stops without changing anything if the version holds a different build. Linux, no Mac.
name: Submit for review
on:
  workflow_dispatch:
    inputs:
      build:
        description: "The build Tyler approved (the version must hold exactly this one)"
        required: true
permissions:
  contents: read
concurrency:
  group: store
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Submit
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD: ${{ inputs.build }}
        run: |
          umask 077; mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8"
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" -q install cryptography==44.0.2 pyjwt==2.10.1
          "$RUNNER_TEMP/venv/bin/python" -I scripts/asc.py submit "$BUILD" || rc=$?
          rm -rf "$RUNNER_TEMP/asc"
          exit ${rc:-0}
