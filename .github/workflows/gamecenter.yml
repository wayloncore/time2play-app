# Game Center (#541): turns on the capability for the App ID, Game Center for the app, and makes the leaderboards and
# achievements (scripts/asc.py gamecenter). Linux only, no Mac minutes. Safe to run again: it only adds what's missing.
# Start it by hand (Actions -> Game Center -> Run workflow, or the REST dispatch), or with [gamecenter] in a pushed
# commit's message. It never submits anything.
name: Game Center
on:
  workflow_dispatch:
  push:
    branches: [main, "app-gamecenter**"]
permissions:
  contents: read
concurrency:
  group: gamecenter
  cancel-in-progress: false
jobs:
  setup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gamecenter]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Leaderboards and achievements in App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          umask 077; mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8"
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" -q install cryptography==44.0.2 pyjwt==2.10.1
          "$RUNNER_TEMP/venv/bin/python" -I scripts/asc.py gamecenter
          rm -rf "$RUNNER_TEMP/asc"
