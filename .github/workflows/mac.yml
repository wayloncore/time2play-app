# The batched Mac run (#398): package tests, build, UI tests in the iPhone simulator, and screenshots printed into the
# log (a cloud session can read job logs but not artifact downloads). One run per finished piece, not per change:
# start it by hand (Actions -> Mac build -> Run workflow, or the REST dispatch), or put [mac] in a pushed commit's
# message. A run bills about 4-6 Mac minutes, which count 10x against the plan's minutes on a private repo.
name: Mac build
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these UI tests (xcodebuild -only-testing values, space-separated; empty runs them all)"
        required: false
        default: ""
      ipad:
        description: "Also run the screenshot tour (UITests/TourUITests) on an iPad simulator"
        required: false
        default: "false"
      ipad_only:
        description: "The UI tests the iPad run takes (xcodebuild -only-testing values, space-separated)"
        required: false
        default: "Time2PlayUITests/TourUITests"
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # one per branch, so two sessions' runs never cancel each other
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mac]')
    runs-on: macos-15
    timeout-minutes: 75   # the full suite with #488's tests runs past 30, and the 3D table's games add about 12 (Nov 16)
    steps:
      - uses: actions/checkout@v7
      - name: Versions
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_ENV"
          # App Store uploads need the current SDK: the newest Xcode 26 on the image
          X=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          sw_vers; xcodebuild -version; swift --version
      - name: Does time2play.live name this app? (invite links, #404)
        run: |
          curl -fsS https://time2play.live/.well-known/apple-app-site-association -o aasa.json -w "HTTP %{http_code}, %{content_type}\n" || true
          cat aasa.json 2>/dev/null; echo
          if grep -q "6WK983RXJT.live.time2play.app" aasa.json 2>/dev/null; then echo "AASA OK: names 6WK983RXJT.live.time2play.app"; else echo "::warning::time2play.live's apple-app-site-association doesn't name 6WK983RXJT.live.time2play.app"; fi
      - name: Core package tests (no UI)
        run: |
          t=$(date +%s); cd Core && swift test > ../core.log 2>&1; tail -6 ../core.log; grep -E "error: " ../core.log | head -30
          echo "core_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Generate the Xcode project
        run: brew install xcodegen >/dev/null && xcodegen generate
      - name: Pick and boot an iPhone simulator
        run: |
          t=$(date +%s)
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              m=re.search(r"iOS-(\d+)-(\d+)",rt)
              if not m: continue
              v=(int(m.group(1)),int(m.group(2)))
              for x in devs:
                  if re.fullmatch(r"iPhone \d+( Pro)?",x["name"]):
                      k=(v,x["name"])
                      if best is None or k>best[0]: best=(k,x["udid"],x["name"],rt)
          print(best[1]); print(best[2],best[3],file=sys.stderr)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          echo "boot_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Build and run the UI tests
        env:
          ONLY: ${{ github.event.inputs.only }}
          # App Review's sign-in key (#403), for the account tests; they skip without it
          TEST_RUNNER_REVIEW_KEY: ${{ secrets.REVIEW_SIGNIN_KEY }}
        run: |
          t=$(date +%s)
          set -o pipefail
          mkdir -p "$HOME/t2p-shots"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          sel=""; for o in $ONLY; do sel="$sel -only-testing:$o"; done
          xcodebuild -project Time2Play.xcodeproj -scheme Time2Play -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build -resultBundlePath build/ui.xcresult \
            -parallel-testing-enabled NO $sel \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | grep -E "Test (Case|Suite)|error:|failed|XCTAssert|\*\* TEST|Executed" | tail -60
          echo "test_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: The tour again on an iPad (#405)
        if: github.event.inputs.ipad == 'true'
        env:
          IPAD_ONLY: ${{ github.event.inputs.ipad_only }}
        run: |
          t=$(date +%s)
          IPAD=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              m=re.search(r"iOS-(\d+)-(\d+)",rt)
              if not m: continue
              for x in devs:
                  if x["name"].startswith("iPad Pro") or x["name"].startswith("iPad Air"):
                      k=((int(m.group(1)),int(m.group(2))),x["name"].startswith("iPad Pro"),x["name"])
                      if best is None or k>best[0]: best=(k,x["udid"])
          print(best[1])')
          xcrun simctl boot "$IPAD"; xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl status_bar "$IPAD" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3
          set -o pipefail
          isel=""; for o in ${IPAD_ONLY:-Time2PlayUITests/TourUITests}; do isel="$isel -only-testing:$o"; done
          xcodebuild -project Time2Play.xcodeproj -scheme Time2Play -configuration Debug \
            -destination "id=$IPAD" -derivedDataPath build -resultBundlePath build/ipad.xcresult \
            -parallel-testing-enabled NO $isel \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | grep -E "Test (Case|Suite)|error:|failed|XCTAssert|\*\* TEST|Executed" | tail -40
          echo "ipad_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Why tests failed (the result bundle's failure messages)
        if: always()
        run: |
          for b in ui ipad; do
            [ -d build/$b.xcresult ] || continue
            xcrun xcresulttool get test-results summary --path build/$b.xcresult --format json > summary.json 2>/dev/null || continue
            echo "== $b"
            python3 -c '
          import json
          s=json.load(open("summary.json"))
          print("RESULT", s.get("result"), "passed", s.get("passedTests"), "failed", s.get("failedTests"), "skipped", s.get("skippedTests"))
          for f in s.get("testFailures", []): print("FAILURE", f.get("testIdentifierString") or f.get("testName"), "::", f.get("failureText"))'
          done
      - name: Screenshots into the log
        if: always()
        run: |
          for f in "$HOME"/t2p-shots/*.png; do [ -f "$f" ] || continue; echo "BEGIN-SHOT $(basename "$f")"; base64 -i "$f" | fold -w 4000; echo "END-SHOT"; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-shots
          path: |
            ~/t2p-shots/
            build/ui.xcresult
          retention-days: 14
      - name: Timing
        if: always()
        run: |
          total=$(( $(date +%s) - start ))
          { echo "## Timing (seconds)"; echo "core tests: ${core_s:-?}, boot: ${boot_s:-?}, build + UI tests: ${test_s:-?}, job steps total: $total"; } >> "$GITHUB_STEP_SUMMARY"
          echo "TIMING core=${core_s:-?} boot=${boot_s:-?} test=${test_s:-?} ipad=${ipad_s:-0} total=$total"
