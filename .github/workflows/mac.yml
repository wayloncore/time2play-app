# The batched Mac run (#398): package tests, build, UI tests in the iPhone simulator, and screenshots printed into the
# log (a cloud session can read job logs but not artifact downloads). One run per finished piece, not per change:
# start it by hand (Actions -> Mac build -> Run workflow, or the REST dispatch), or put [mac] in a pushed commit's
# message. A run bills about 4-6 Mac minutes, which count 10x against the plan's minutes on a private repo.
name: Mac build
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these UI tests (xcodebuild -only-testing values, space-separated; empty runs them all)"
        required: false
        default: ""
      ipad:
        description: "Also run the screenshot tour (UITests/TourUITests) on an iPad simulator"
        required: false
        default: "false"
      ipad_only:
        description: "The UI tests the iPad run takes (xcodebuild -only-testing values, space-separated)"
        required: false
        default: "Time2PlayUITests/TourUITests"
      older_only:
        description: "Also run these UI tests on an older, smaller iPhone simulator (iPhone SE or the oldest iPhone on the image; empty skips it)"
        required: false
        default: ""
      largest_only:
        description: "Also run these UI tests on the largest iPhone simulator (the newest Pro Max or Plus on the image; empty skips it)"
        required: false
        default: ""
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # one per branch, so two sessions' runs never cancel each other
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mac]')
    runs-on: macos-15
    timeout-minutes: 110   # the full suite runs past 40, and the 3D table's games on an iPad add about 25 (Nov 17)
    steps:
      - uses: actions/checkout@v7
      - name: Versions
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_ENV"
          # App Store uploads need the current SDK: the newest Xcode 26 on the image
          X=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          sw_vers; xcodebuild -version; swift --version
      - name: Does time2play.live name this app? (invite links, #404)
        run: |
          curl -fsS https://time2play.live/.well-known/apple-app-site-association -o aasa.json -w "HTTP %{http_code}, %{content_type}\n" || true
          cat aasa.json 2>/dev/null; echo
          if grep -q "6WK983RXJT.live.time2play.app" aasa.json 2>/dev/null; then echo "AASA OK: names 6WK983RXJT.live.time2play.app"; else echo "::warning::time2play.live's apple-app-site-association doesn't name 6WK983RXJT.live.time2play.app"; fi
      - name: Core package tests (no UI)
        run: |
          # bash -e stops at a failing command: print why before failing
          t=$(date +%s); cd Core && swift test > ../core.log 2>&1 || { grep -E "error: |failed|XCTAssert" ../core.log | head -60; tail -15 ../core.log; exit 1; }
          tail -6 ../core.log; grep -E "dice throws" ../core.log | head -3
          echo "core_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Generate the Xcode project
        run: brew install xcodegen >/dev/null && xcodegen generate
      - name: Pick and boot an iPhone simulator
        run: |
          t=$(date +%s)
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              m=re.search(r"iOS-(\d+)-(\d+)",rt)
              if not m: continue
              v=(int(m.group(1)),int(m.group(2)))
              for x in devs:
                  if re.fullmatch(r"iPhone \d+( Pro)?",x["name"]):
                      k=(v,x["name"])
                      if best is None or k>best[0]: best=(k,x["udid"],x["name"],rt)
          print(best[1]); print(best[2],best[3],file=sys.stderr)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          echo "boot_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Build and run the UI tests
        env:
          ONLY: ${{ github.event.inputs.only }}
          # App Review's sign-in key (#403), for the account tests; they skip without it
          TEST_RUNNER_REVIEW_KEY: ${{ secrets.REVIEW_SIGNIN_KEY }}
        run: |
          t=$(date +%s)
          set -o pipefail
          mkdir -p "$HOME/t2p-shots"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          sel=""; for o in $ONLY; do sel="$sel -only-testing:$o"; done
          mkdir -p build   # tee writes its log there before xcodebuild makes the folder
          xcodebuild -project Time2Play.xcodeproj -scheme Time2Play -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build -resultBundlePath build/ui.xcresult \
            -parallel-testing-enabled NO $sel \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/ui-test.log | grep -E "Test (Case|Suite)|error:|failed|XCTAssert|\*\* TEST|Executed" | tail -60
          grep -E "^FPS " build/ui-test.log || true   # frame-rate lines a test printed (#719)
          echo "test_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: The launch screen in the built app (wayloncore/tyleralocke#562)
        if: always()
        run: |
          A=build/Build/Products/Debug-iphonesimulator/Time2Play.app
          [ -d "$A" ] || exit 0
          echo "UILaunchScreen: $(plutil -extract UILaunchScreen json -o - "$A/Info.plist" 2>&1)"
          xcrun assetutil --info "$A/Assets.car" 2>/dev/null | python3 -c '
          import json,sys
          for a in json.load(sys.stdin):
              if a.get("Name") == "LaunchNavy": print("LaunchNavy:", a.get("Color components"), a.get("Colorspace"))' || true
          ls -l "$A"/intro.mp4 "$A"/intro-end.jpg "$A"/waiting-loop.mp4 "$A"/waiting-still.jpg 2>&1 || true   # #543: the waiting loop too
      - name: The tour again on an iPad (#405)
        # runs even when an iPhone test failed, so one run still checks both
        if: ${{ !cancelled() && github.event.inputs.ipad == 'true' }}
        env:
          IPAD_ONLY: ${{ github.event.inputs.ipad_only }}
        run: |
          t=$(date +%s)
          IPAD=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              m=re.search(r"iOS-(\d+)-(\d+)",rt)
              if not m: continue
              for x in devs:
                  if x["name"].startswith("iPad Pro") or x["name"].startswith("iPad Air"):
                      k=((int(m.group(1)),int(m.group(2))),x["name"].startswith("iPad Pro"),x["name"])
                      if best is None or k>best[0]: best=(k,x["udid"])
          print(best[1])')
          xcrun simctl boot "$IPAD"; xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl status_bar "$IPAD" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3
          set -o pipefail
          isel=""; for o in ${IPAD_ONLY:-Time2PlayUITests/TourUITests}; do isel="$isel -only-testing:$o"; done
          xcodebuild -project Time2Play.xcodeproj -scheme Time2Play -configuration Debug \
            -destination "id=$IPAD" -derivedDataPath build -resultBundlePath build/ipad.xcresult \
            -parallel-testing-enabled NO $isel \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | grep -E "Test (Case|Suite)|error:|failed|XCTAssert|\*\* TEST|Executed" | tail -40
          echo "ipad_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Some tests again on an older iPhone (#719)
        if: ${{ !cancelled() && github.event.inputs.older_only != '' }}
        env:
          OLDER_ONLY: ${{ github.event.inputs.older_only }}
        run: |
          t=$(date +%s)
          OLD=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              m=re.search(r"iOS-(\d+)-(\d+)",rt)
              if not m: continue
              for x in devs:
                  if not x["name"].startswith("iPhone"): continue
                  se="SE" in x["name"]; n=re.search(r"iPhone (\d+)",x["name"])
                  k=(0 if se else 1, int(n.group(1)) if n else 99, (int(m.group(1)),int(m.group(2))))
                  if best is None or k<best[0]: best=(k,x["udid"],x["name"],rt)
          print(best[1]); print(best[2],best[3],file=sys.stderr)')
          xcrun simctl boot "$OLD"; xcrun simctl bootstatus "$OLD" -b
          xcrun simctl status_bar "$OLD" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          set -o pipefail
          osel=""; for o in $OLDER_ONLY; do osel="$osel -only-testing:$o"; done
          # the older phone's shots carry "older-" (T2P_SHOT_PREFIX, read by UITests/Support.swift's shot)
          TEST_RUNNER_T2P_SHOT_PREFIX=older- xcodebuild -project Time2Play.xcodeproj -scheme Time2Play -configuration Debug \
            -destination "id=$OLD" -derivedDataPath build -resultBundlePath build/older.xcresult \
            -parallel-testing-enabled NO $osel \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/older-test.log | grep -E "Test (Case|Suite)|error:|failed|XCTAssert|\*\* TEST|Executed" | tail -40
          grep -E "^FPS " build/older-test.log | sed 's/^/older: /' || true
          echo "older_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Some tests again on the largest iPhone (#721)
        if: ${{ !cancelled() && github.event.inputs.largest_only != '' }}
        env:
          LARGEST_ONLY: ${{ github.event.inputs.largest_only }}
        run: |
          t=$(date +%s)
          BIG=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              m=re.search(r"iOS-(\d+)-(\d+)",rt)
              if not m: continue
              for x in devs:
                  if not re.fullmatch(r"iPhone \d+ (Pro Max|Plus)",x["name"]): continue
                  n=int(re.search(r"iPhone (\d+)",x["name"]).group(1))
                  k=((int(m.group(1)),int(m.group(2))), n, "Max" in x["name"])
                  if best is None or k>best[0]: best=(k,x["udid"],x["name"],rt)
          print(best[1]); print(best[2],best[3],file=sys.stderr)')
          xcrun simctl boot "$BIG"; xcrun simctl bootstatus "$BIG" -b
          xcrun simctl status_bar "$BIG" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          set -o pipefail
          lsel=""; for o in $LARGEST_ONLY; do lsel="$lsel -only-testing:$o"; done
          # the largest phone's shots carry "largest-" (T2P_SHOT_PREFIX, read by UITests/Support.swift's shot)
          TEST_RUNNER_T2P_SHOT_PREFIX=largest- xcodebuild -project Time2Play.xcodeproj -scheme Time2Play -configuration Debug \
            -destination "id=$BIG" -derivedDataPath build -resultBundlePath build/largest.xcresult \
            -parallel-testing-enabled NO $lsel \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/largest-test.log | grep -E "Test (Case|Suite)|error:|failed|XCTAssert|\*\* TEST|Executed" | tail -40
          echo "largest_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Why tests failed (the result bundle's failure messages)
        if: always()
        run: |
          for b in ui ipad older largest; do
            [ -d build/$b.xcresult ] || continue
            xcrun xcresulttool get test-results summary --path build/$b.xcresult --format json > summary.json 2>/dev/null || continue
            echo "== $b"
            python3 -c '
          import json
          s=json.load(open("summary.json"))
          print("RESULT", s.get("result"), "passed", s.get("passedTests"), "failed", s.get("failedTests"), "skipped", s.get("skippedTests"))
          for f in s.get("testFailures", []): print("FAILURE", f.get("testIdentifierString") or f.get("testName"), "::", f.get("failureText"))'
          done
      - name: App crashes (the simulator's crash reports, the crashed thread)
        if: always()
        run: |
          ls -t "$HOME"/Library/Logs/DiagnosticReports/Time2Play*.ips 2>/dev/null | head -5 | while read f; do
            echo "== crash report: $(basename "$f")"
            python3 - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          head, _, body = raw.partition("\n")
          b = json.loads(body)
          print("exception:", json.dumps(b.get("exception")), "termination:", json.dumps(b.get("termination", {}).get("indicator")))
          for k in ("asi", "lastExceptionBacktrace"):
              if b.get(k): print(k, json.dumps(b[k])[:1500])
          imgs = b.get("usedImages", [])
          for t in b.get("threads", []):
              if not t.get("triggered"): continue
              print("crashed thread:", t.get("name") or t.get("queue") or "")
              for fr in t.get("frames", [])[:40]:
                  im = imgs[fr["imageIndex"]].get("name", "?") if fr.get("imageIndex") is not None and fr["imageIndex"] < len(imgs) else "?"
                  print("  ", im, fr.get("symbol", hex(fr.get("imageOffset", 0))), "+", fr.get("symbolLocation", ""), fr.get("sourceFile", ""), fr.get("sourceLine", ""))
          PY
          done
      - name: Screenshots into the log
        if: always()
        run: |
          # as JPEGs (a fifth the size of the PNGs): long logs lose characters, and a smaller shot comes through whole
          for f in "$HOME"/t2p-shots/*.png; do
            [ -f "$f" ] || continue
            j="${f%.png}.jpg"; sips -s format jpeg -s formatOptions 82 "$f" --out "$j" >/dev/null 2>&1 || j="$f"
            echo "BEGIN-SHOT $(basename "$j")"; base64 -i "$j" | fold -w 4000; echo "END-SHOT"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-shots
          path: |
            ~/t2p-shots/
            build/ui.xcresult
          retention-days: 14
      - name: Timing
        if: always()
        run: |
          total=$(( $(date +%s) - start ))
          { echo "## Timing (seconds)"; echo "core tests: ${core_s:-?}, boot: ${boot_s:-?}, build + UI tests: ${test_s:-?}, job steps total: $total"; } >> "$GITHUB_STEP_SUMMARY"
          echo "TIMING core=${core_s:-?} boot=${boot_s:-?} test=${test_s:-?} ipad=${ipad_s:-0} older=${older_s:-0} largest=${largest_s:-0} total=$total"
