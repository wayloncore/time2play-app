# The batched Mac run (#398): package tests, build, UI tests in the iPhone simulator, and screenshots printed into the
# log (a cloud session can read job logs but not artifact downloads). One run per finished piece, not per change:
# start it by hand (Actions -> Mac build -> Run workflow, or the REST dispatch), or put [mac] in a pushed commit's
# message. A run bills about 4-6 Mac minutes, which count 10x against the plan's minutes on a private repo.
name: Mac build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mac-build
  cancel-in-progress: true
jobs:
  simulator:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mac]')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Versions
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_ENV"
          # App Store uploads need the current SDK: the newest Xcode 26 on the image
          X=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          sw_vers; xcodebuild -version; swift --version
      - name: Core package tests (no UI)
        run: |
          t=$(date +%s); cd Core && swift test 2>&1 | tail -6
          echo "core_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Generate the Xcode project
        run: brew install xcodegen >/dev/null && xcodegen generate
      - name: Pick and boot an iPhone simulator
        run: |
          t=$(date +%s)
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              m=re.search(r"iOS-(\d+)-(\d+)",rt)
              if not m: continue
              v=(int(m.group(1)),int(m.group(2)))
              for x in devs:
                  if re.fullmatch(r"iPhone \d+( Pro)?",x["name"]):
                      k=(v,x["name"])
                      if best is None or k>best[0]: best=(k,x["udid"],x["name"],rt)
          print(best[1]); print(best[2],best[3],file=sys.stderr)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          echo "boot_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Build and run the UI tests
        run: |
          t=$(date +%s)
          set -o pipefail
          xcodebuild -project Time2Play.xcodeproj -scheme Time2Play -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build -resultBundlePath build/ui.xcresult \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | grep -E "Test (Case|Suite)|error:|\*\* TEST|Executed" | tail -30
          echo "test_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Install, launch and screenshot
        run: |
          t=$(date +%s); mkdir -p shots
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          APP=$(find build/Build/Products -maxdepth 2 -name 'Time2Play.app' | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" live.time2play.app
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/home.png
          xcrun simctl ui "$UDID" appearance light
          sleep 3
          xcrun simctl io "$UDID" screenshot shots/home-light-system.png
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl ui "$UDID" content_size extra-extra-extra-large
          sleep 3
          xcrun simctl io "$UDID" screenshot shots/home-larger-text.png
          echo "shot_s=$(( $(date +%s) - t ))" >> "$GITHUB_ENV"
      - name: Screenshots into the log
        run: |
          for f in shots/*.png; do echo "BEGIN-SHOT $(basename "$f")"; base64 -i "$f" | fold -w 4000; echo "END-SHOT"; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-shots
          path: |
            shots/
            build/ui.xcresult
          retention-days: 14
      - name: Timing
        if: always()
        run: |
          total=$(( $(date +%s) - start ))
          { echo "## Timing (seconds)"; echo "core tests: ${core_s:-?}, boot: ${boot_s:-?}, build + UI tests: ${test_s:-?}, screenshots: ${shot_s:-?}, job steps total: $total"; } >> "$GITHUB_STEP_SUMMARY"
          echo "TIMING core=${core_s:-?} boot=${boot_s:-?} test=${test_s:-?} shot=${shot_s:-?} total=$total"
